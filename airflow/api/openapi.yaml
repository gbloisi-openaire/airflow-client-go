openapi: 3.1.0
info:
  description: "Airflow API. All endpoints located under ``/api/v2`` can be used safely,\
    \ are stable and backward compatible. Endpoints located under ``/ui`` are dedicated\
    \ to the UI and are subject to breaking change depending on the need of the frontend.\
    \ Users should not rely on those but use the public ones instead."
  title: Airflow API
  version: "2"
servers:
- url: /
paths:
  /api/v2/assets:
    get:
      description: Get assets.
      operationId: get_assets
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 0
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: SQL LIKE expression — use `%` / `_` wildcards (e.g. `%customer_%`).
          Regular expressions are **not** supported.
        explode: true
        in: query
        name: name_pattern
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: SQL LIKE expression — use `%` / `_` wildcards (e.g. `%customer_%`).
          Regular expressions are **not** supported.
        explode: true
        in: query
        name: uri_pattern
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: dag_ids
        required: false
        schema:
          items:
            nullable: true
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: only_active
        required: false
        schema:
          default: true
          title: Only Active
          type: boolean
        style: form
      - explode: true
        in: query
        name: order_by
        required: false
        schema:
          default: id
          title: Order By
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCollectionResponse"
          description: Successful Response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPExceptionResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPExceptionResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPExceptionResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Assets
      tags:
      - Asset
  /api/v2/assets/aliases:
