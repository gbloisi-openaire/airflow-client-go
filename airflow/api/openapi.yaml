          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Asset Events
      tags:
      - Asset
    post:
